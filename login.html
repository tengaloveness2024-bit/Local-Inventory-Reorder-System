<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory System - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            width: 360px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #1f6feb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1558b0;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 5px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Inventory System</h1>

    <div class="subtitle">
        Local Inventory & Automated Reorder Management
    </div>

    <form id="loginForm">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <div id="message"></div>

    <div class="demo">
        <strong>Demonstration Account</strong><br><br>
        Username: admin<br>
        Password: admin123
    </div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    message.textContent = "Logging in...";

    try {

        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (data.success) {

            message.textContent = "Login successful.";

            window.location.href = "/dashboard.html";

        } else {

            message.textContent = data.error || "Login failed.";

        }

    } catch (error) {

        message.textContent =
            "Unable to connect to the server.";

        console.error(error);
    }

});

</script>

</body>
</html>
