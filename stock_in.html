<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock In - Inventory System</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #17365d;
            color: white;
            padding: 18px 25px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        nav {
            background: white;
            padding: 12px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav a {
            color: #17365d;
            text-decoration: none;
            font-weight: bold;
            margin-right: 15px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            color: #17365d;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            display: none;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #eef3f8;
            border-radius: 5px;
        }

        @media(max-width:600px) {
            .container {
                padding: 12px;
            }

            nav a {
                display: block;
                margin-bottom: 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Stock In / Receive Stock</h1>
</header>

<nav>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/products.html">Products</a>
    <a href="/suppliers.html">Suppliers</a>
    <a href="/stock_in.html">Stock In</a>
    <a href="/stock_out.html">Stock Out</a>
    <a href="/reorders.html">Reorders</a>
    <a href="/reports.html">Reports</a>
    <a href="/admin.html">Admin</a>
</nav>

<div class="container">

    <div id="message"></div>

    <div class="panel">

        <h2>Record Stock Received</h2>

        <form id="stockInForm">

            <label for="product">Select Product</label>

            <select id="product" required>
                <option value="">Select a product</option>
            </select>

            <div class="info">
                Current Stock:
                <strong id="currentStock">-</strong>
            </div>

            <label for="quantity">Quantity Received</label>

            <input
                type="number"
                id="quantity"
                min="1"
                required
                placeholder="Enter quantity received"
            >

            <button type="submit">
                Record Stock In
            </button>

        </form>

    </div>

</div>

<script>

let products = [];


/* LOAD PRODUCTS */

async function loadProducts() {

    try {

        const response =
            await fetch("/api/products");

        if (response.status === 401) {
            window.location.href = "/login.html";
            return;
        }

        if (!response.ok) {
            throw new Error("Unable to load products");
        }

        products =
            await response.json();

        const select =
            document.getElementById("product");

        select.innerHTML =
            '<option value="">Select a product</option>';

        products.forEach(product => {

            const option =
                document.createElement("option");

            option.value = product.id;

            option.textContent =
                product.product_code +
                " - " +
                product.name;

            select.appendChild(option);
        });

    } catch (error) {

        showMessage(
            "Unable to load products.",
            false
        );

        console.error(error);
    }
}


/* SHOW CURRENT STOCK */

document.getElementById("product")
.addEventListener("change", function() {

    const product =
        products.find(
            p => p.id == this.value
        );

    document.getElementById("currentStock")
        .textContent =
        product ? product.quantity : "-";
});


/* MESSAGE */

function showMessage(message, success = true) {

    const box =
        document.getElementById("message");

    box.textContent = message;

    box.style.display = "block";

    box.style.background =
        success ? "#dff0d8" : "#f2dede";

    box.style.color =
        success ? "#3c763d" : "#a94442";
}


/* SUBMIT */

document.getElementById("stockInForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const productId =
        document.getElementById("product").value;

    const quantity =
        Number(
            document.getElementById("quantity").value
        );


    if (!productId) {

        showMessage(
            "Please select a product.",
            false
        );

        return;
    }


    if (!Number.isInteger(quantity) ||
        quantity <= 0) {

        showMessage(
            "Quantity must be a whole number greater than zero.",
            false
        );

        return;
    }


    try {

        const response =
            await fetch("/api/stock-in", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    product_id: Number(productId),
                    quantity: quantity
                })
            });


        const result =
            await response.json();


        if (!response.ok) {

            showMessage(
                result.error ||
                "Stock-in failed.",
                false
            );

            return;
        }


        showMessage(
            "Stock received successfully. Inventory quantity has been updated."
        );


        document.getElementById("stockInForm")
            .reset();

        document.getElementById("currentStock")
            .textContent = "-";


        loadProducts();

    } catch (error) {

        showMessage(
            "Server error. Make sure Flask is running.",
            false
        );

        console.error(error);
    }

});


loadProducts();

</script>

</body>
</html>
